name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15'

      - name: Archive
        run: |
          xcodebuild archive \
            -project Boop.xcodeproj \
            -scheme Boop \
            -archivePath build/Boop.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package
        run: |
          mkdir -p build/export
          cp -R build/Boop.xcarchive/Products/Applications/Boop.app build/export/
          cd build/export && zip -r ../../build/Boop-Mac.zip Boop.app

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/Boop-Mac.zip
