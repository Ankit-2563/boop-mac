name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Build Release Binary
        run: swift build -c release

      - name: Create App Bundle
        run: |
          mkdir -p Boop.app/Contents/MacOS
          mkdir -p Boop.app/Contents/Resources
          cp .build/release/Boop Boop.app/Contents/MacOS/Boop
          chmod +x Boop.app/Contents/MacOS/Boop
          cp Boop/Info.plist Boop.app/Contents/Info.plist 2>/dev/null || true
          codesign --force --deep -s - Boop.app
          zip -r Boop-macOS.zip Boop.app

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: Boop-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
